# The public face of the site — the static bundle, and the API under /api.
#
# Mounted into the `web` service in docker-compose.yml. Both halves are served
# from one origin because the box has no public address of its own: a Cloudflare
# Tunnel elsewhere on the LAN reaches it at :4173, and a second hostname would
# need a second tunnel route on a machine this one cannot see. The note above
# that service has the whole argument.
#
# TLS is not here and should not be. Cloudflare terminates it at the edge and
# the tunnel carries the request the rest of the way, so this listens on plain
# HTTP inside Docker and is never reachable from the internet directly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MAX_PRINT_FILE_MB defaults to 30, and whichever cap is smaller is the real
    # one. nginx's default is 1 MB, and it refuses the upload with a 413 that
    # never reaches the API's log — so a member's print request would fail with
    # nothing on the server to explain it. Raise both together.
    client_max_body_size 32m;

    # Compression for the things that benefit. The API sets its own (Hono's
    # `compress()`), so this is only for what nginx serves itself.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --------------------------------------------------------------- the API
    #
    # Everything the browser calls lives under /api, so one location covers the
    # lot. No trailing slash on `proxy_pass`: the path has to arrive at the API
    # exactly as it was asked for, because the app mounts its routes at /api
    # too. Adding one here would strip the prefix and every route would 404.
    location /api/ {
        # **Resolved per request, not once at startup, and the variable is what
        # forces that.** nginx resolves a literal upstream name when it loads
        # its config and then caches the address for the life of the process.
        # Docker gives a container a new IP every time it is recreated — which
        # `docker compose restart api`, a crash, and every redeploy all do — so
        # a literal `proxy_pass http://api:4000` leaves nginx proxying to an
        # address nothing is listening on, answering 502 until nginx itself is
        # restarted. That is a genuinely confusing failure: the API is up, the
        # site is down, and the logs of both look fine.
        #
        # 127.0.0.11 is Docker's embedded DNS, the same resolver the container
        # already uses. `valid=10s` caps how long a stale answer can survive.
        #
        # With a variable and no path component, nginx passes the original
        # request URI through unchanged — which is what is wanted here, because
        # the app mounts its own routes under /api. Adding a path (even a bare
        # `/`) would strip the prefix and every route would 404.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:4000;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;

        # **The line the rate limits depend on, and it must be `set`, not
        # appended.** The API honours X-Forwarded-For when TRUST_PROXY=true and
        # takes the first entry. `$proxy_add_x_forwarded_for` would append to
        # whatever the client sent, leaving a value the client chose at the
        # front — so a script could put a fresh address on every request and
        # never share a counter with itself. `CF-Connecting-IP` is set by
        # Cloudflare at the edge and passed through by the tunnel, and it is
        # the one header a client cannot forge past Cloudflare.
        #
        # It is empty for anything that did not come through Cloudflare — a
        # request from the LAN, or a health check. That is fine and deliberate:
        # an empty header is falsy in `clientAddress`, which then falls back to
        # the socket address rather than trusting anything.
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;

        # Long enough for a 30 MB print model on a slow connection. The default
        # 60s cuts those off mid-upload.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_request_buffering off;
    }

    # ----------------------------------------------------------- the bundle
    #
    # Vite hashes every filename, so a file at one of these paths can never
    # change — it can only stop being referenced. A year is the standard answer
    # and `immutable` stops the browser even asking.
    location /assets/ {
        # One header, not two. `expires 1y` emits a `Cache-Control: max-age=…`
        # of its own, so pairing it with an `add_header Cache-Control` sends the
        # response out carrying *both* — which is legal, ambiguous, and leaves
        # what a CDN actually does up to the CDN. `expires off` suppresses
        # nginx's and leaves this line as the only answer.
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html itself must never be cached, or a browser holding yesterday's
    # copy asks for asset filenames that no longer exist and the site is blank
    # until somebody hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Any other path is a React route, not a file. Hand back index.html and let
    # the router work it out.
    #
    # **This is not optional.** Without it `/join` returns 404 before React ever
    # runs — and `/join?token=…` is the link in every signup verification email,
    # `/dashboard/dues?payment_intent=…` the address a bank returns a member to
    # after 3-D Secure.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
