# Compose project name is distinct from the older `rccf` stack in
# Documents/RCCF-V13 so the two never share containers, volumes, or ports.
name: rccf-v13

services:
  postgres:
    image: postgres:18-alpine
    container_name: rccf-v13-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rccf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rccf}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images store data in a version-named subdirectory, so the
      # mount goes at /var/lib/postgresql — mounting .../data makes them refuse
      # to start. Do not add a PGDATA override; that writes to the container's
      # own layer instead of the volume and the data dies with the container.
      - data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-rccf} -d $${POSTGRES_DB:-rccf}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Applies migrations once, before any API instance comes up. If each replica
  # ran them itself, a scaled deploy would have N processes racing on the same
  # migration table.
  migrate:
    build: .
    image: rccf-v13-api
    profiles: [app]
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rccf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rccf}?schema=public

  # Stateless — every instance keeps its rate-limit windows in Postgres, so you
  # can run as many as you like:
  #   docker compose --profile app up -d --scale api=3
  api:
    build: .
    image: rccf-v13-api
    profiles: [app]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # **Everything the app is configured with, and without this line almost
    # none of it reaches the container.** `.dockerignore` keeps `.env` out of
    # the image — correctly, an image with a live bot token in a layer is a
    # secret you cannot revoke by deleting a file — so the only way the running
    # container learns `SITE_URL`, the Postmark token, the Discord bot token,
    # the Stripe keys, the session settings and the dues prices is here.
    #
    # It was missing, and the failure was quiet in the worst way: the API came
    # up perfectly happy, announced every optional service as OFF, defaulted
    # `SITE_URL` to `http://localhost:5173` — so every verification email
    # pointed at the reader's own laptop — and refused signups with a 503 that
    # reads like a mail outage.
    #
    # `environment:` below wins over this on any key it also sets, which is the
    # point: `DATABASE_URL` in `.env` names `localhost:5433`, correct for the
    # host tooling that reads it, and wrong inside this network where the
    # database answers to `postgres:5432`.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rccf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rccf}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-5}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-600}
    ports:
      # A range rather than one port, so --scale can bind each replica.
      #
      # **Set `API_PORT_RANGE=127.0.0.1:4000-4004` wherever the `web` service
      # below is doing the serving.** It reaches the API over this compose
      # network by service name, not through a published port, so binding these
      # to loopback costs nothing and closes a real hole: with `TRUST_PROXY=true`
      # the API believes `X-Forwarded-For`, and anything that can reach port
      # 4000 directly can therefore put a fresh fake address on every request
      # and never meet a rate limit.
      - "${API_PORT_RANGE:-4000-4004}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The site itself: the built frontend, and the one origin both halves are
  # served from.
  #
  #   docker compose --profile app --profile web up -d
  #
  # **One origin rather than a site host and an api host, and that is forced
  # rather than chosen.** The club's box has no public address — it sits on a
  # LAN at 192.168.105.20 — and what carries the internet to it is a Cloudflare
  # Tunnel running on another machine, aimed at port 4173, which is the port the
  # *old* SvelteKit site published. Serving the whole thing on 4173 means the
  # tunnel, the DNS record and the certificate all keep working with nothing
  # touched. A second hostname would mean a second tunnel route on a machine
  # this one cannot see.
  #
  # It is also simply the better shape here. The browser never makes a
  # cross-origin request, so there is no CORS to get wrong, no `SameSite=None`,
  # no second certificate, and no `www` host quietly failing every API call.
  # Everything the frontend calls lives under `/api`, so one `location` covers
  # it — see `nginx.conf`.
  web:
    image: nginx:1.27-alpine
    container_name: rccf-v13-web
    profiles: [web]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The output of `npm run build` in web/, copied here. Read-only: nothing
      # in this container has any business writing to it.
      - ${WEB_ROOT:-/srv/rccf/web}:/usr/share/nginx/html:ro
    ports:
      # 4173 because that is where the tunnel already points. Change both
      # together or the site answers on a port nothing is asking about.
      - "${WEB_PORT:-4173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional web UI. Off by default; start with:
  #   docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4
    container_name: rccf-v13-pgadmin
    profiles: [tools]
    restart: unless-stopped
    environment:
      # Not a .local address — pgAdmin validates this and refuses to boot on a
      # reserved TLD, crash-looping with "does not appear to be a valid email".
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  data:
  pgadmin:
