name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the run still in flight — no point
# spending minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The server tests run against a real database rather than a mock, so CI
    # needs one. 5432 here because nothing else is competing for it; only the
    # local setup moves to 5433.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rccf
          POSTGRES_PASSWORD: rccf
          POSTGRES_DB: rccf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rccf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rccf:rccf@localhost:5432/rccf?schema=public
      # env.ts validates these and refuses to start without them.
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: 'false'

    steps:
      # Both pinned to a major that runs on node24. v4 ran on node20, which
      # the runners now force onto 24 anyway and warn about every run. The
      # majors in between changed nothing this workflow uses: setup-node v5
      # only auto-caches when package.json has a `packageManager` field, and
      # none of the three here does, while `cache: npm` below is explicit.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            server/package-lock.json

      # `npm ci` rather than `install`: it honours the lockfile exactly and
      # fails if one has drifted from its package.json.
      - name: Install
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix web ci

      - name: Generate Prisma client
        run: npm --prefix server run generate

      # Everything from here to the build needs no database, so it runs first:
      # a type error should not wait behind Postgres starting and a seed.

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm --prefix server run typecheck

      # `web`'s build is `tsc -b && vite build`, so this is the frontend
      # typecheck as well as the build. It is ahead of the database steps for
      # that reason.
      - name: Build
        run: npm run build

      # Vite inlines every `VITE_`-prefixed variable into the bundle without
      # asking whether it should, and the result is served to the world. This
      # is the check that a server-side key never became a public one.
      #
      # `pk_live_` is deliberately absent from the pattern: a Stripe
      # *publishable* key is public by design and is supposed to be in there.
      # These four are the ones that must never leave the server.
      - name: Check no secret key reached the bundle
        run: |
          if grep -rIEl 'sk_(live|test)_[A-Za-z0-9]{8}|rk_live_[A-Za-z0-9]{8}|whsec_[A-Za-z0-9]{8}' web/dist; then
            echo "::error::a secret key is in web/dist — look for a VITE_-prefixed secret in web/.env.production"
            exit 1
          fi
          echo "no secret keys in web/dist"

      # `npm --prefix` sets the package prefix but does NOT change the working
      # directory, so `npm --prefix server exec` ran prisma from the repo root,
      # where there is no prisma.config.ts and no prisma/schema.prisma. It has
      # failed on every run this workflow has ever had — and because it sits
      # ahead of the tests, nothing below it had executed once. `npm --prefix
      # server run` is unaffected, which is why generate above always worked.
      - name: Apply migrations
        working-directory: server
        run: npx prisma migrate deploy

      # The migrations having applied says nothing about whether they build the
      # schema the code was typechecked against. Edit `schema.prisma` without
      # generating a migration and every step above still passes — the Prisma
      # client is generated from the schema, so the types agree with each other
      # while the database disagrees with both, and the failure lands on deploy.
      #
      # This compares the freshly migrated database against `schema.prisma`.
      # `--exit-code` returns 2 when they differ, which fails the step.
      - name: Check for migration drift
        working-directory: server
        run: |
          if ! npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code; then
            echo "::error::schema.prisma and the migrations disagree — run 'npm run migrate' in server/ and commit the migration it generates"
            exit 1
          fi

      # The server tests assert against seeded rows, so the database has to have
      # them before the suite runs.
      - name: Seed
        run: npm --prefix server run seed

      - name: Test
        run: npm test

      # The six signature tests in `dues.test.ts` are `it.runIf(webhooksConfigured)`,
      # and `webhooksConfigured` is `Boolean(STRIPE_SECRET_KEY && STRIPE_WEBHOOK_SECRET)`
      # in `src/payments/stripe.ts`. Neither is set above, so until now CI had
      # never once run the security boundary on the one route that takes money —
      # they reported as passing by not existing.
      #
      # The keys below are invented and never leave the runner. Nothing here
      # reaches Stripe: the suite signs its own deliveries with
      # `generateTestHeaderString`, which is local HMAC, and the two checkout
      # tests that run unconditionally refuse at 409 and 400 before any call is
      # made. `paymentIntents.create` is not on the path.
      #
      # It is a second run of the one file rather than keys on the job, because
      # setting them globally would skip the test that covers *unconfigured*
      # Stripe — a supported state the club spent its whole previous site in.
      # The first run covers that; this one covers the signature check.
      - name: Test the webhook signature boundary
        working-directory: server
        env:
          STRIPE_SECRET_KEY: sk_test_00000000000000000000000000
          STRIPE_WEBHOOK_SECRET: whsec_0000000000000000000000000000000000
        run: npx vitest run src/routes/member/dues.test.ts
